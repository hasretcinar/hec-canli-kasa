<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yayın Ekranı - Canlı Kasa</title>
  <link rel="stylesheet" href="style.css?v=genel2">
</head>
<body class="display-page">
<button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Tam Ekran</button>

<div class="display-control-dock hidden" id="displayControlDock">
  <button class="control-toggle" onclick="toggleDisplayControls()">🎮 Kontrol</button>
  <div class="display-control-panel" id="displayControlPanel">
    <strong>Yayın Kontrolü</strong>
    <button class="btn primary mini-control" onclick="doDisplayStart()">Oyunu Başlat</button>
    <button class="btn success mini-control" onclick="doDisplayReveal()">Cevabı Aç</button>
    <button class="btn primary mini-control" onclick="doDisplayNext()">Sonraki Soru</button>
    <button class="btn secondary mini-control" onclick="doDisplayFinal()">Final</button>
    <button class="btn danger mini-control" onclick="doDisplayReset()">Sıfırla</button>
  </div>
</div>

<div class="app display-app">
  <main class="panel main-panel display-main">
    <header class="header">
      <div class="logo">💸 Canlı Kasa</div>
      <div class="center-timer" aria-label="Süre göstergesi">⏱ <span>Kalan Süre</span> <strong id="timerText">-</strong></div>
      <div class="status">
        <span>Oda: <strong id="hRoom">-</strong></span>
        <span>Durum: <strong id="hPhase">-</strong></span>
        <span>Soru: <strong id="hRound">-</strong></span>
      </div>
    </header>
    <section class="content display-content">
      <div id="questionArea"></div>
      <div id="resultsBox"></div>
    </section>
  </main>

  <aside class="side-panel display-ranking">
    <section class="side-card">
      <div class="side-title">Canlı Sıralama</div>
      <div class="side-body players" id="playersBox"></div>
    </section>
  </aside>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="firebase-config.js?v=genel2"></script>
<script src="game.js?v=genel2"></script>
<script>
let roomCode = qs("room") || prompt("Yayın ekranı için oda kodu:");
let state = null;
let activeRef = null;
const controlMode = qs("control") === "1";

function listenRoom(code){
  if(activeRef) activeRef.off();
  activeRef = roomRef(code);
  activeRef.on("value", snap=>{
    state = snap.val();
    if(!state) return;
    renderHeader(state);
    renderQuestion(state);
    renderPlayers(state);
    renderResults(state);
    renderDisplayControlState();
  });
}

startLocalTick(()=>{ if(state){ renderTimer(state); } });

function toggleDisplayControls(){
  byId("displayControlDock")?.classList.toggle("collapsed");
}

function keydownDisplayControl(e){
  if(e.ctrlKey && e.key.toLowerCase() === "k"){
    e.preventDefault();
    toggleDisplayControls();
  }
}
document.addEventListener("keydown", keydownDisplayControl);

function renderDisplayControlState(){
  const dock = byId("displayControlDock");
  if(dock) dock.classList.toggle("hidden", !controlMode);
}

async function doDisplayStart(){
  try{
    const duration = Number(state?.duration || DEFAULT_DURATION);
    await startGame(roomCode, duration);
  }catch(e){ console.warn(e.message); }
}

async function doDisplayReveal(){
  try{ await revealAnswer(roomCode); }catch(e){ console.warn(e.message); }
}

async function doDisplayNext(){
  try{ await nextQuestion(roomCode); }catch(e){ console.warn(e.message); }
}

async function doDisplayFinal(){
  try{ await showFinal(roomCode); }catch(e){ console.warn(e.message); }
}

async function doDisplayReset(){
  try{ await resetRoom(roomCode); }catch(e){ console.warn(e.message); }
}

if(roomCode){
  loadQuestionBank();
  roomCode = roomCode.toUpperCase();
  listenRoom(roomCode);
  renderDisplayControlState();
}
</script>
</body>
</html>
